[project]
name = "wsj27-auth-api"
version = "0.3.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "httpx[http2]",
    "joserfc",
    "cryptography",
    "pydantic-settings",
    "prometheus-fastapi-instrumentator",
]

[dependency-groups]
# debugpy is what the VSCode launch configs attach to; without it F5 fails
# silently, before the app produces any output.
dev = [
    "pytest>=8,<10",
    "debugpy",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Silences a pytest-asyncio deprecation warning; the default becomes
# function-scoped in a later release and this pins today's behaviour.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
